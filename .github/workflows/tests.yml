name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        exclude:
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo
          coverage: none

      - name: Install dependencies
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
        run: |
          composer require "illuminate/database:${LARAVEL_VERSION}" "illuminate/support:${LARAVEL_VERSION}" --no-update
          composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --testsuite=Unit

  driver-shapes:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - 'postgres:14'
          - 'postgres:15'
          - 'postgres:16'
          - 'postgres:17'
          - 'postgres:18'
          - 'mysql:8.4'
          - 'mysql:9.7'
          - 'mariadb:10.11'
          - 'mariadb:11.4'
          - 'mariadb:11.8'
          - 'mariadb:12.3'
        laravel: ['13.*']
        # causedByLostConnection() delegates to Laravel's own detector, whose message
        # list changes between releases, so one engine per family also runs on 12.*.
        include:
          - image: 'postgres:17'
            laravel: '12.*'
          - image: 'mysql:8.4'
            laravel: '12.*'

    name: Driver shapes / ${{ matrix.image }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pdo_mysql
          coverage: none

      - name: Install dependencies
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
        run: |
          composer require "illuminate/database:${LARAVEL_VERSION}" "illuminate/support:${LARAVEL_VERSION}" --no-update
          composer install --no-interaction --prefer-dist

      - name: Start ${{ matrix.image }}
        env:
          DB_IMAGE: ${{ matrix.image }}
        run: .github/scripts/start-db.sh "$DB_IMAGE"

      - name: Assert auth-rejection classification against a real server
        run: vendor/bin/phpunit --testsuite=Integration --testdox
